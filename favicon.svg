<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#1a1a1a"/>
  <!-- channel strips -->
  <rect x="16" y="20" width="12" height="88" rx="3" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="0.5"/>
  <rect x="34" y="20" width="12" height="88" rx="3" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="0.5"/>
  <rect x="52" y="20" width="12" height="88" rx="3" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="0.5"/>
  <rect x="70" y="20" width="12" height="88" rx="3" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="0.5"/>
  <!-- master strip -->
  <rect x="92" y="20" width="20" height="88" rx="3" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="0.5"/>
  <!-- fader slots -->
  <rect x="20" y="52" width="4" height="40" rx="1" fill="#111"/>
  <rect x="38" y="52" width="4" height="40" rx="1" fill="#111"/>
  <rect x="56" y="52" width="4" height="40" rx="1" fill="#111"/>
  <rect x="74" y="52" width="4" height="40" rx="1" fill="#111"/>
  <rect x="99" y="48" width="6" height="48" rx="1.5" fill="#111"/>
  <!-- fader caps at different positions -->
  <rect x="18" y="68" width="8" height="6" rx="1.5" fill="#ccc"/>
  <rect x="36" y="60" width="8" height="6" rx="1.5" fill="#ccc"/>
  <rect x="54" y="74" width="8" height="6" rx="1.5" fill="#ccc"/>
  <rect x="72" y="64" width="8" height="6" rx="1.5" fill="#ccc"/>
  <rect x="96" y="56" width="12" height="7" rx="2" fill="#e0e0e0"/>
  <!-- knobs (EQ/gain) -->
  <circle cx="22" cy="30" r="4" fill="#444" stroke="#555" stroke-width="0.5"/>
  <circle cx="40" cy="30" r="4" fill="#444" stroke="#555" stroke-width="0.5"/>
  <circle cx="58" cy="30" r="4" fill="#444" stroke="#555" stroke-width="0.5"/>
  <circle cx="76" cy="30" r="4" fill="#444" stroke="#555" stroke-width="0.5"/>
  <!-- knob indicators -->
  <line x1="22" y1="30" x2="22" y2="26.5" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="30" x2="42.5" y2="28" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="30" x2="58" y2="26.5" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="76" y1="30" x2="73.5" y2="28" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <!-- second row of knobs -->
  <circle cx="22" cy="42" r="3" fill="#444" stroke="#555" stroke-width="0.5"/>
  <circle cx="40" cy="42" r="3" fill="#444" stroke="#555" stroke-width="0.5"/>
  <circle cx="58" cy="42" r="3" fill="#444" stroke="#555" stroke-width="0.5"/>
  <circle cx="76" cy="42" r="3" fill="#444" stroke="#555" stroke-width="0.5"/>
  <!-- master meter LEDs -->
  <rect x="96" y="24" width="3" height="3" rx="0.5" fill="#2ecc40"/>
  <rect x="100" y="24" width="3" height="3" rx="0.5" fill="#2ecc40"/>
  <rect x="96" y="29" width="3" height="3" rx="0.5" fill="#2ecc40"/>
  <rect x="100" y="29" width="3" height="3" rx="0.5" fill="#2ecc40"/>
  <rect x="96" y="34" width="3" height="3" rx="0.5" fill="#ffdc00"/>
  <rect x="100" y="34" width="3" height="3" rx="0.5" fill="#ffdc00"/>
  <rect x="96" y="39" width="3" height="3" rx="0.5" fill="#333"/>
  <rect x="100" y="39" width="3" height="3" rx="0.5" fill="#333"/>
  <!-- PFL buttons -->
  <rect x="18" y="96" width="8" height="5" rx="1" fill="#185FA5"/>
  <rect x="36" y="96" width="8" height="5" rx="1" fill="#333"/>
  <rect x="54" y="96" width="8" height="5" rx="1" fill="#333"/>
  <rect x="72" y="96" width="8" height="5" rx="1" fill="#333"/>
</svg>
